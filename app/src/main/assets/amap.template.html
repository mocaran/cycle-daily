<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #dce8e6; }
    .my-location { width: 22px; height: 22px; border: 4px solid white; border-radius: 50%; background: #38bdf2; box-shadow: 0 1px 7px #0005; }
  </style>
  <script>
    window._AMapSecurityConfig = { securityJsCode: '__AMAP_SECURITY_CODE__' };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=__AMAP_WEB_KEY__"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    (function () {
      let map = null;
      let overlays = [];
      let pendingData = null;
      let pendingCenter = null;
      let lastData = '';
      const storedZoom = Number(localStorage.getItem('cycleDailyZoom'));
      const initialZoom = Number.isFinite(storedZoom) && storedZoom >= 14 && storedZoom <= 26 ? storedZoom : 20;

      window.renderNative = function (data) {
        pendingData = data;
        if (!map) return;
        const encoded = JSON.stringify(data);
        if (encoded === lastData) return;
        lastData = encoded;
        if (overlays.length) map.remove(overlays);
        overlays = [];
        (data.paths || []).forEach(function (path) {
          if (!path.points || path.points.length < 2) return;
          overlays.push(new AMap.Polyline({
            path: path.points, strokeColor: path.color || '#c8f17e',
            strokeWeight: 6, strokeOpacity: 0.95, lineJoin: 'round', lineCap: 'round',
            zIndex: 110
          }));
        });
        if (data.point) overlays.push(new AMap.Marker({
          position: data.point,
          anchor: 'center',
          content: '<div class="my-location"></div>',
          zIndex: 120
        }));
        if (overlays.length) map.add(overlays);
      };
      window.centerNative = function (lon, lat) {
        pendingCenter = [lon, lat];
        if (map) map.setCenter(pendingCenter);
      };
      window.syncZoomNative = function () {
        if (map) map.resize();
      };

      if (!window.AMap) return;
      map = new AMap.Map('map', {
        center: [114.367, 30.535], zoom: initialZoom, zooms: [14, 26],
        viewMode: '2D', resizeEnable: true, showIndoorMap: false
      });
      window.CycleDailyMapReady = true;
      if (pendingCenter) map.setCenter(pendingCenter);
      if (pendingData) window.renderNative(pendingData);
      map.on('zoomend', function () {
        try { localStorage.setItem('cycleDailyZoom', String(map.getZoom())); } catch (e) {}
      });
      map.on('complete', function () {
        if (window.CycleDailyBridge) window.CycleDailyBridge.ready();
      });
    }());
  </script>
</body>
</html>
